# Levantar todo: docker compose up -d --build
name: eter-entrega2

# Variables comunes a los 4 microservicios.
x-servicio-eter: &servicio-eter
  restart: on-failure
  depends_on: &dependencias-base
    postgres: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
  healthcheck:
    # Cada servicio declara su puerto en SERVER_PORT.
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 40s

x-entorno-eter: &entorno-eter
  ETER_DB_USER: ${POSTGRES_USER:-postgres}
  ETER_DB_PASSWORD: ${POSTGRES_PASSWORD:-eter_dev_2026}
  ETER_JWT_SECRET: ${ETER_JWT_SECRET:-eter-jwt-secret-development-only-CHANGE-IN-PRODUCTION-9f4a8c7e}
  ETER_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

services:
  # Infraestructura
  postgres:
    image: postgres:16-alpine
    container_name: eter-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eterdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eter_dev_2026}
    ports: ["5433:5432"]
    volumes: [eter_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eterdb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: eter-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: red interna de Docker; EXTERNAL: desde el host.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los topicos se crean en kafka-init.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Crea los topicos y termina.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: eter-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in eter.prestamos.eventos.v1 eter.prestamos.eventos.v1.DLT eter.activos.eventos.v1 eter.activos.eventos.v1.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        echo '>>> topicos listos:'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # Idempotencia de los consumidores.
  redis:
    image: redis:7.4-alpine
    container_name: eter-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [eter_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eter-kafka-ui
    ports: ["8092:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: eter-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      kafka: { condition: service_healthy }

  # Microservicios
  activos:
    <<: *servicio-eter
    build: ../services/eter-activos-service
    image: eter/activos-service:entrega2p2
    container_name: eter-activos
    ports: ["8087:8087"]
    environment:
      <<: *entorno-eter
      SERVER_PORT: 8087
      ETER_ACTIVOS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eterdb}?currentSchema=activos

  prestamos:
    <<: *servicio-eter
    build: ../services/eter-prestamos-service
    image: eter/prestamos-service:entrega2p2
    container_name: eter-prestamos
    ports: ["8088:8088"]
    environment:
      <<: *entorno-eter
      SERVER_PORT: 8088
      ETER_PRESTAMOS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eterdb}?currentSchema=prestamos
      ETER_ACTIVOS_BASE_URL: http://activos:8087
      # Vigia cada 30 s para la demo.
      ETER_VIGIA_DELAY_MS: 30000

  inventario:
    <<: *servicio-eter
    build: ../services/eter-inventario-service
    image: eter/inventario-service:entrega2p2
    container_name: eter-inventario
    ports: ["8089:8089"]
    depends_on:
      <<: *dependencias-base
      redis: { condition: service_healthy }
    environment:
      <<: *entorno-eter
      SERVER_PORT: 8089
      ETER_INVENTARIO_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eterdb}?currentSchema=inventario
      ETER_ACTIVOS_BASE_URL: http://activos:8087
      ETER_REDIS_HOST: redis

  notificaciones:
    <<: *servicio-eter
    build: ../services/eter-notificaciones-service
    image: eter/notificaciones-service:entrega2p2
    container_name: eter-notificaciones
    ports: ["8090:8090"]
    depends_on:
      <<: *dependencias-base
      redis: { condition: service_healthy }
    environment:
      <<: *entorno-eter
      SERVER_PORT: 8090
      ETER_NOTIFICACIONES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eterdb}?currentSchema=notificaciones
      ETER_REDIS_HOST: redis

  # Gateway GraphQL (Spring Boot + Spring for GraphQL): punto de entrada del frontend.
  graphql-gateway:
    build: ../services/eter-graphql-gateway
    image: eter/graphql-gateway:entrega2p2
    container_name: eter-graphql-gateway
    restart: on-failure
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      activos: { condition: service_healthy }
      prestamos: { condition: service_healthy }
      inventario: { condition: service_healthy }
      notificaciones: { condition: service_healthy }
    environment:
      ETER_JWT_SECRET: ${ETER_JWT_SECRET:-eter-jwt-secret-development-only-CHANGE-IN-PRODUCTION-9f4a8c7e}
      ETER_ACTIVOS_BASE_URL: http://activos:8087
      ETER_PRESTAMOS_BASE_URL: http://prestamos:8088
      ETER_INVENTARIO_BASE_URL: http://inventario:8089
      ETER_NOTIFICACIONES_BASE_URL: http://notificaciones:8090

volumes:
  eter_postgres_data: {}
  eter_redis_data: {}
