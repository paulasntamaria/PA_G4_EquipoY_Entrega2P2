server:
  port: "${PORT:4000}"

spring:
  application:
    name: eter-graphql-gateway
  # Hilos virtuales: cada llamada REST a un microservicio bloquea su hilo sin costo.
  threads:
    virtual:
      enabled: true
  graphql:
    # HTTP y WebSocket comparten la ruta /graphql.
    websocket:
      path: /graphql
      keep-alive: 20s
    # El frontend se abre desde file:// (origen "null"): se acepta cualquier origen, sin credenciales.
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST
      allowed-headers: "*"

eter:
  jwt:
    secret: "${ETER_JWT_SECRET:eter-jwt-secret-development-only-CHANGE-IN-PRODUCTION-9f4a8c7e}"
  gateway:
    timeout-ms: "${ETER_DOWNSTREAM_TIMEOUT_MS:5000}"
    # Cada cuánto consulta la bandeja de cada suscriptor de notificacionRecibida.
    poll-notificaciones-ms: "${ETER_POLL_NOTIFICACIONES_MS:5000}"
  services:
    activos-base-url: "${ETER_ACTIVOS_BASE_URL:http://localhost:8087}"
    prestamos-base-url: "${ETER_PRESTAMOS_BASE_URL:http://localhost:8088}"
    inventario-base-url: "${ETER_INVENTARIO_BASE_URL:http://localhost:8089}"
    notificaciones-base-url: "${ETER_NOTIFICACIONES_BASE_URL:http://localhost:8090}"

management:
  endpoints:
    web:
      exposure:
        include: health
